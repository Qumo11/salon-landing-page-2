<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="Sabai — masaz tajski">
  <title>Sabai — masaz tajski</title>
  <!-- Pelne logo do uzycia POZA strona: wizytowka, Facebook, ulotka, pieczatka.
       Wersja na JASNE tlo. Na ciemnym tle wystarczy podmienic kolory:
       znak -> #D8C4A6, napis -> #FFFFFF.
       Uwaga: napis renderuje sie krojem szeryfowym z systemu (Georgia).
       Na stronie ten sam znak stoi nad napisem zlozonym krojem Lustria. -->
  <g transform="translate(105 8) scale(.9167)" color="#B78D65">
    <path d="M40.5 108.2A52 52 0 1 1 79.5 108.2" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5"/>
    <g fill="currentColor" opacity=".8">
