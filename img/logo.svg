  </g>
  <text x="152.5" y="180" text-anchor="middle" font-family="Lustria, Georgia, serif" font-size="36" letter-spacing="15" fill="#2C221C">SABAI</text>
  <text x="157" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="6" fill="#8A6A4A">MASA&#379; TAJSKI</text>
</svg>
